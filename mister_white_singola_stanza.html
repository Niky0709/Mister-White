<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<title>MISTER WHITE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121f;--card:#1f1c30;--card2:#2a2642;--txt:#f1eefc;--mut:#9a95b8;--acc:#8b7bff;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 'Google Sans Flex','Google Sans',Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:8px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top>span:last-child{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
input{font-family:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--card2);background:var(--bg);color:var(--txt);font-size:16px;margin:6px 0}
button{font-family:inherit;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;width:100%;margin:6px 0;cursor:pointer}
button.sec{background:var(--card2)}
button.sm{width:auto;padding:8px 14px;margin:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card2)}
.pl:last-child{border:0}
.dead{opacity:.5;text-decoration:line-through}
.tag{font-size:12px;color:var(--mut)}
.word{font-size:30px;font-weight:800;text-align:center;padding:18px 0;color:var(--acc)}
.msg{background:var(--card2);border-radius:10px;padding:10px;margin:10px 0;text-align:center}
.err{color:#f87171;font-style:italic}
.win{font-size:22px;font-weight:800;text-align:center;color:var(--ok)}
.cur{color:var(--acc);font-weight:700}
.votes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.votes button{margin:0}
.votes button:last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 4px)}
.link{word-break:break-all;font-size:13px;color:var(--mut);background:var(--bg);padding:8px;border-radius:8px}

.hero{text-align:center;margin:18px 0 8px}
.logo{display:inline-flex;filter:drop-shadow(0 0 12px rgba(255,255,255,.18));animation:float 3.6s ease-in-out infinite}
.logo svg{display:block}
.logo .glint{animation:glint 3s ease-in-out infinite}
.brand{font-weight:800;text-transform:uppercase;letter-spacing:.16em;margin:0}
.brand.big{font-size:34px;margin-top:6px}
.brand.sm{font-size:15px}
.brand span{display:inline-block;color:#fff}
.brand .sp{width:.5em}
.tl{display:flex;align-items:center;gap:8px}
.brand span:not(.sp){animation:wave 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*140ms)}
.logo.intro{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,float 3.6s ease-in-out .9s infinite}
.brand.intro span:not(.sp){animation:rise .9s cubic-bezier(.22,1,.36,1) both,wave 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*80ms),calc(.9s + var(--i)*140ms)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{0%{transform:translateY(24px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes wave{0%,100%{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.6)}50%{color:#5a5a5a;text-shadow:0 0 0 rgba(255,255,255,0)}}
@keyframes glint{0%,65%,100%{opacity:.35}82%{opacity:1}}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;object-fit:cover;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.58);line-height:1;flex:none;vertical-align:middle;overflow:hidden}
.pn{display:flex;align-items:center;gap:10px;min-width:0}
.vb{display:flex;align-items:center;gap:8px;justify-content:flex-start;overflow:hidden;text-align:left}
.emojis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.em{margin:0;padding:6px 0;font-size:24px;background:var(--card2);border-radius:12px;line-height:1.2}
.em.sel{outline:2px solid #fff}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickrow button{margin:0;font-size:14px;padding:11px 8px}
.namerow{display:flex;gap:12px;align-items:center}
.namerow input{margin:0;flex:1;min-width:0}
.avbox{position:relative;display:inline-flex;flex:none}
.pencil{position:absolute;right:-5px;bottom:-5px;width:max(20px,calc(var(--s)*.4));height:max(20px,calc(var(--s)*.4));padding:0;margin:0;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.pencil svg{width:58%;height:58%}
.panel{background:var(--bg);border-radius:12px;padding:2px 10px 10px;margin:10px 0 4px}
</style>
</head>

/* ---------- rete ---------- */
function send(m){ if(isHost) handle(myId,m); else if(hostConn&&hostConn.open) hostConn.send(m); }
function recv(m){ view=m.s; me=m.me||{}; render(); }

function createRoom(){
  const name=$('#name').value.trim(); if(!name){status='Inserisci il tuo nome';return render();}
  code='AMICI';
  status='Creo la stanza…';render();
  peer=new Peer('mrwhite-amici');
  peer.on('open',id=>{
    myId=id;isHost=true;
    G={phase:'lobby',players:[{id,name:name.slice(0,16),alive:true,av:myAv}],order:[],turn:0,clues:[],round:0,votes:{},msg:'',winner:null,guessFor:null,settings:{u:1,w:1}};
    broadcast();
  });
  peer.on('connection',c=>{
    c.on('open',()=>{conns[c.peer]=c});
    c.on('data',m=>handle(c.peer,m));
    c.on('close',()=>leave(c.peer));
  });
  peer.on('error',e=>{ if(e.type==='unavailable-id'){peer.destroy();createRoom();} else {status='Errore di rete: '+e.type;view=null;render();} });
}

function joinRoom(){
  const name=$('#name').value.trim();
  if(!name){status='Inserisci il tuo nome';return render();}
  code='AMICI';status='Mi collego…';render();
  peer=new Peer();
  peer.on('open',id=>{
    myId=id;
    hostConn=peer.connect('mrwhite-amici',{reliable:true});
    hostConn.on('open',()=>hostConn.send({t:'join',name,av:myAv}));
    hostConn.on('data',m=>{ if(m.t==='state')recv(m); else if(m.t==='av'){AV=m.map;render();} else if(m.t==='err'){status=m.e;view=null;render();} });
    hostConn.on('close',()=>{view=null;status='Connessione persa. Ricarica la pagina per rientrare.';render();});
  });
  peer.on('error',e=>{status=e.type==='peer-unavailable'?'Stanza non trovata':'Errore di rete: '+e.type;view=null;render();});
}

/* ---------- logica (solo host) ---------- */
function pub(){
  const end=G.phase==='end';
  return {phase:G.phase,round:G.round,code,hostId:myId,
    players:G.players.map(p=>({id:p.id,name:p.name,alive:p.alive,left:!!p.left,role:(end||(!p.alive&&!p.left))?p.role:null,word:end?p.word:null})),
    order:G.order,turn:G.turn,clues:G.clues,voted:Object.keys(G.votes),msg:G.msg,winner:G.winner,guessFor:G.guessFor,settings:G.settings,civWord:end?G.civWord:null};
}
function broadcast(){
  const s=pub();
  G.players.forEach(p=>{
    const m={t:'state',s,me:{role:p.role,word:p.word}};
    if(p.id===myId) recv(m); else if(conns[p.id]&&conns[p.id].open) conns[p.id].send(m);
  });
}
function alive(){return G.players.filter(p=>p.alive)}
function checkWin(){
  const imp=alive().filter(p=>p.role!=='civile').length, civ=alive().filter(p=>p.role==='civile').length;
  if(imp===0) return 'I Civili';
  if(civ<=imp) return 'Gli Impostori';
  return null;
}
function newRound(){
  G.round++;G.votes={};G.turn=0;G.phase='clues';G.msg='';G.guessFor=null;
  G.order=shuffle(alive().map(p=>p.id));
}
function start(){
  const n=G.players.length,{u,w}=G.settings;
  if(n<3||u+w<1||n-u-w<=u+w){G.msg='Servono almeno 3 giocatori e più civili che impostori.';return;}
  const pair=pickPair();
  G.civWord=pair[0];G.uWord=pair[1];
  const roles=shuffle([...Array(u).fill('undercover'),...Array(w).fill('mrwhite'),...Array(n-u-w).fill('civile')]);
  G.players.forEach((p,i)=>{p.role=roles[i];p.alive=true;p.left=false;p.word=p.role==='civile'?pair[0]:p.role==='undercover'?pair[1]:''});
  G.round=0;G.winner=null;G.clues=[];newRound();
}
function afterElim(){const w=checkWin();if(w){G.winner=w;G.phase='end'}else G.phase='result'}
function tallyIfDone(){
  const voters=alive().map(p=>p.id);
  if(!voters.every(id=>G.votes[id]))return;
  const cnt={};Object.values(G.votes).forEach(t=>cnt[t]=(cnt[t]||0)+1);
  const max=Math.max(...Object.values(cnt));
  const tops=Object.keys(cnt).filter(k=>cnt[k]===max);
  if(tops.length>1){G.msg='Pareggio! Nessuno viene eliminato.';G.phase='result';return;}
  if(tops[0]==='skip'){G.msg='Votazione skippata. Nessuno viene eliminato.';G.phase='result';return;}
  const P=G.players.find(p=>p.id===tops[0]);if(!P)return;P.alive=false;
  G.msg=`${P.name} è stato eliminato: era ${ROLE[P.role]}.`;
  if(P.role==='mrwhite'){G.phase='guess';G.guessFor=P.id}else afterElim();
}
function leave(id){
  const P=G&&G.players.find(p=>p.id===id);if(!P)return;
  if(G.phase==='lobby') G.players=G.players.filter(p=>p!==P);
  else if(P.alive){
    P.alive=false;P.left=true;
    const i=G.order.indexOf(id);if(i>=0){G.order.splice(i,1);if(i<G.turn)G.turn--}
    delete G.votes[id];
    if(G.phase==='guess'&&G.guessFor===id){afterElim()}
    else if(G.phase!=='end'&&G.phase!=='guess'){
      const w=checkWin();
      if(w){G.winner=w;G.phase='end'}
      else if(G.phase==='clues'&&G.turn>=G.order.length)G.phase='vote';
      else if(G.phase==='vote')tallyIfDone();
    }
  }
  broadcast();
}
function handle(id,m){
  const P=G.players.find(p=>p.id===id), host=id===myId;
  if(m.t==='join'){
    if(G.phase!=='lobby'||G.players.length>=12){conns[id]&&conns[id].send({t:'err',e:'Partita già iniziata o stanza piena'});return;}
    if(!P)G.players.push({id,name:String(m.name).slice(0,16),alive:true,av:validAv(m.av)?m.av:'e:🙂'});
  }else if(m.t==='avatar'&&P&&G.phase==='lobby'&&validAv(m.av)){P.av=m.av;
  }else if(m.t==='set'&&host&&G.phase==='lobby'){
    const lim={u:3,w:2};G.settings[m.k]=Math.max(0,Math.min(lim[m.k],G.settings[m.k]+m.d));
  }else if(m.t==='start'&&host&&G.phase==='lobby'){G.msg='';start();}
  else if(m.t==='clue'&&G.phase==='clues'&&G.order[G.turn]===id&&String(m.text).trim()){
    G.clues.push({round:G.round,name:P.name,text:String(m.text).trim().slice(0,24)});
    G.turn++;if(G.turn>=G.order.length)G.phase='vote';
  }else if(m.t==='vote'&&G.phase==='vote'&&P&&P.alive&&!G.votes[id]&&m.target!==id){
    if(m.target==='skip'){G.votes[id]='skip';tallyIfDone();}
    else {const T=G.players.find(p=>p.id===m.target);
      if(T&&T.alive){G.votes[id]=m.target;tallyIfDone();}}
  }else if(m.t==='guess'&&G.phase==='guess'&&id===G.guessFor){
    const ok=norm(m.text)===norm(G.civWord);
    G.guessFor=null;
    if(ok){G.msg+=` Ha indovinato la parola: "${G.civWord}"!`;G.winner='Mister White';G.phase='end';}
    else{G.msg+=` Ha provato "${String(m.text).slice(0,24)}": sbagliato.`;afterElim();}
  }else if(m.t==='next'&&host&&G.phase==='result')newRound();
  else if(m.t==='reset'&&host&&G.phase==='end'){
    G.phase='lobby';G.clues=[];G.msg='';G.winner=null;G.round=0;
    G.players=G.players.filter(p=>!p.left);G.players.forEach(p=>{p.alive=true;delete p.role;delete p.word});
  }
  broadcast();
  if(m.t==='join'||m.t==='avatar')sendAvatars();
}
function sendAvatars(){const map={};G.players.forEach(p=>{if(p.av)map[p.id]=p.av});AV=map;Object.values(conns).forEach(c=>c.open&&c.send({t:'av',map}));render();}

    const prev=$('#name')?$('#name').value:'';const prevCode=$('#code')?$('#code').value:pre;
    a.innerHTML=`<div class="hero">${LOGO(130)}<h1 class="brand big${intro?' intro':''}">${brand('MISTER WHITE')}</h1></div><div class="mut">Gioco di parole e bluff. Gratis, senza server.</div>
    <div class="card"><div class="namerow">${avEdit(56)}<input id="name" placeholder="MA CHI SI?" maxlength="16" value="${esc(prev)}"></div>${showPicker?pickerHtml():''}
    <button onclick="createRoom()">Crea la partita</button>
    <button class="sec" onclick="joinRoom()">Entra nella partita</button>
    <div class="mut" style="text-align:center">Una sola stanza per il vostro gruppo: chi crea la partita condivide il link con gli amici.</div>
    ${status?(status.endsWith('…')?`<div class="msg">${esc(status)}</div>`:`<div class="msg err">* ${esc(status)} *</div>`):''}</div>`;
    return;
  }
  const s=view,host=s.hostId===myId,pl=s.players,cur=pl.find(p=>p.id===myId)||{};
  let h=`<div class="top"><span class="tl">${LOGO(30)}<b class="brand sm">${brand('MISTER WHITE')}</b></span><span>${s.round?`Giro ${s.round}`:''}</span></div>`;

  if(s.phase==='lobby'){
    h+=`<div class="card"><div class="mut">Invita gli amici (iPhone e Android, basta il browser):</div>
    <div class="link">${esc(location.origin+location.pathname)}</div>
    <button class="sec" onclick="shareLink()">Condividi link</button></div>
    <div class="card"><b>Giocatori (${pl.length})</b>${pl.map(p=>`<div class="pl"><span class="pn">${p.id===myId?avEdit(36):avHtml(AV[p.id])}${esc(p.name)}</span><span class="tag">${p.id===s.hostId?'host':''}</span></div>`).join('')}</div>
    ${showPicker?`<div class="card">${pickerHtml()}</div>`:''}`;
    if(host){
      h+=`<div class="card"><div class="row"><span>Undercover</span><span><button class="sm sec" onclick="act('set',{k:'u',d:-1})">−</button> <b>${s.settings.u}</b> <button class="sm sec" onclick="act('set',{k:'u',d:1})">+</button></span></div>
      <div class="row" style="margin-top:8px"><span>Mister White</span><span><button class="sm sec" onclick="act('set',{k:'w',d:-1})">−</button> <b>${s.settings.w}</b> <button class="sm sec" onclick="act('set',{k:'w',d:1})">+</button></span></div>
      <div class="mut" style="margin-top:8px">Serve almeno 3 giocatori e più civili che impostori.</div></div>
      <button onclick="act('start')">Inizia partita</button>`;
    }else h+=`<div class="msg">Aspetta che l'host inizi la partita…</div>`;
    if(s.msg)h+=`<div class="msg">${esc(s.msg)}</div>`;
    a.innerHTML=h;return;
  }

  if(s.phase!=='end'){
    h+=`<div class="card"><div class="row"><b>La tua parola</b><button class="sm sec" onclick="toggleWord()">${showWord?'Nascondi':'Mostra'}</button></div>`;
    if(showWord) h+= me.role==='mrwhite'?`<div class="word" style="font-size:20px">Sei Mister White!<br><span class="mut">Nessuna parola: ascolta e bluffa.</span></div>`:`<div class="word">${esc(me.word)}</div>`;
    h+=`</div>`;
    if(!cur.alive)h+=`<div class="msg">Sei fuori dal gioco. Guarda come va a finire!</div>`;
  }

  h+=`<div class="card"><b>Giocatori</b>${pl.map(p=>`<div class="pl"><span class="pn ${p.alive?'':'dead'}${s.phase==='clues'&&s.order[s.turn]===p.id?' cur':''}">${avHtml(AV[p.id])}<span>${esc(p.name)}${p.id===myId?' (tu)':''}</span></span><span class="tag">${p.left?'uscito':(!p.alive&&p.role?ROLE[p.role]:'')}</span></div>`).join('')}</div>`;

  if(s.clues.length){
    const rounds=[...new Set(s.clues.map(c=>c.round))];
    h+=`<div class="card"><b>Indizi</b>${rounds.map(r=>`<div style="margin-top:6px"><span class="tag">Giro ${r}</span><br>${s.clues.filter(c=>c.round===r).map(c=>`${esc(c.name)}: <b>${esc(c.text)}</b>`).join(' · ')}</div>`).join('')}</div>`;
  }
  if(s.msg)h+=`<div class="msg">${esc(s.msg)}</div>`;

  const byId=id=>(pl.find(p=>p.id===id)||{}).name;
  if(s.phase==='clues'){
    const turnId=s.order[s.turn];
    if(turnId===myId&&cur.alive)h+=`<div class="card"><b>Tocca a te!</b><div class="mut">Dai un indizio con UNA parola (senza dire la tua parola).</div><input id="inp" maxlength="24" placeholder="Il tuo indizio" autocomplete="off"><button onclick="submitClue()">Invia indizio</button></div>`;
    else h+=`<div class="msg">Tocca a ${avHtml(AV[turnId],24)} <b>${esc(byId(turnId))}</b>…</div>`;
  }else if(s.phase==='vote'){
    if(cur.alive&&!s.voted.includes(myId))h+=`<div class="card"><b>Chi eliminare?</b><div class="votes">${pl.filter(p=>p.alive&&p.id!==myId).map(p=>`<button class="sec vb" onclick="act('vote',{target:'${p.id}'})">${avHtml(AV[p.id],28)}<span>${esc(p.name)}</span></button>`).join('')}<button class="sec vb" onclick="act('vote',{target:'skip'})">⏭️ <span>Skippa</span></button></div></div>`;
    else h+=`<div class="msg">Votazione in corso… (${s.voted.length}/${pl.filter(p=>p.alive).length})</div>`;
  }else if(s.phase==='guess'){
    if(s.guessFor===myId)h+=`<div class="card"><b>Ultima chance, Mister White!</b><div class="mut">Indovina la parola dei civili per vincere.</div><input id="inp" maxlength="24" placeholder="La parola dei civili" autocomplete="off"><button onclick="submitGuess()">Prova a indovinare</button></div>`;
    else h+=`<div class="msg">Mister White sta cercando di indovinare la parola…</div>`;
  }else if(s.phase==='result'){
    h+=host?`<button onclick="act('next')">Prossimo giro</button>`:`<div class="msg">Aspetta l'host…</div>`;
  }else if(s.phase==='end'){
    h+=`<div class="card"><div class="win">🏆 Vincono: ${esc(s.winner)}</div>
    <div style="text-align:center;margin-top:8px">Parola civili: <b>${esc(s.civWord)}</b></div></div>
    <div class="card"><b>Ruoli</b>${pl.map(p=>`<div class="pl"><span class="pn">${avHtml(AV[p.id])}${esc(p.name)}</span><span class="tag">${ROLE[p.role]||''}${p.word?' · '+esc(p.word):''}</span></div>`).join('')}</div>`;
    h+=host?`<button onclick="act('reset')">Nuova partita</button>`:`<div class="msg">Aspetta l'host per la prossima partita…</div>`;
  }
  a.innerHTML=h;
}
render();
</script>
</body>
</html>
